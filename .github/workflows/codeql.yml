name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 6 * * 1"

# CodeQL の解析結果を GitHub 側に書き込むため security-events 権限が必要
permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # TypeScript でもビルド不要（interpreted 言語として解析される）
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
